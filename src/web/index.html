<!doctype html>
<html lang="ko">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>SpecSignal · 나의 공간</title><link rel="stylesheet" href="/style.css"><script src="/certifications.js" defer></script><script src="/app.js" defer></script></head>
<body>
<header class="titlebar"><div class="titlebar-label pywebview-drag-region">SpecSignal <span>나의 다음 가능성</span></div><span id="preview-label">DESKTOP PREVIEW</span><div id="window-controls" hidden><button id="window-minimize" aria-label="창 최소화">−</button><button id="window-maximize" aria-label="창 최대화 또는 복원">□</button><button id="window-close" aria-label="앱 닫기">×</button></div></header>
<div class="app-layout"><aside class="sidebar"><div class="identity"><span class="avatar">S</span><strong id="profile-name">나의 공간</strong><small>당신의 가능성에, 시그널을.</small></div><nav aria-label="주 메뉴" id="navigation"></nav><div class="sidebar-bottom">작은 준비가 만드는<br>더 큰 가능성.<small>SpecSignal · 나의 성장 기록</small></div></aside>
<main class="main-content"><header class="workspace-top"><span id="breadcrumb">MY SPACE / 홈</span><div class="top-actions"><span class="demo-badge">데모 미리보기</span><button id="notifications-button" class="icon-button" aria-label="최근 알림" aria-expanded="false" aria-controls="notifications"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9M10 21h4"/></svg><span id="notification-dot" class="notification-dot" hidden></span></button><button class="brand" data-page="home">SpecSignal</button></div><section id="notifications" class="popover" aria-label="최근 알림" hidden></section></header><div id="view"></div><footer class="footnote">데모 데이터로 체험하는 SpecSignal · 입력한 내용은 이 브라우저에 저장됩니다.</footer></main></div>
<dialog id="modal" aria-labelledby="modal-title"><div class="modal-heading"><h2 id="modal-title"></h2><button class="icon-button" id="modal-close" aria-label="팝업 닫기">×</button></div><div id="modal-content"></div></dialog><div id="toast" role="status" hidden></div>
</body></html>
